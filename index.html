<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FieldVoice Pro v5</title>
    <link rel="manifest" href="/manifest.json">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .mic-active { animation: pulse 1.5s infinite; background-color: #ef4444 !important; }
        @keyframes pulse { 0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); } 70% { transform: scale(1.05); box-shadow: 0 0 0 15px rgba(239, 68, 68, 0); } 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); } }
    </style>
</head>
<body class="bg-[#F8FAFC] text-[#1E293B] flex flex-col items-center min-h-screen p-4 pb-12">
    
    <header class="w-full max-w-md flex justify-between items-center py-6">
        <div>
            <h1 class="text-xl font-black tracking-tighter">FIELDVOICE <span class="text-blue-600">PRO</span></h1>
            <p id="status" class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mt-1">Ready</p>
        </div>
        <select id="langSelect" class="bg-white border border-slate-200 text-xs font-bold rounded-lg px-2 py-1 outline-none">
            <option value="zh-TW">繁體中文</option>
            <option value="en-US">English</option>
            <option value="sv-SE">Svenska</option>
            <option value="ja-JP">日本語</option>
        </select>
    </header>

    <main class="w-full max-w-md space-y-5">
        
        <div class="bg-white rounded-[2rem] p-8 shadow-sm border border-slate-100 flex flex-col items-center space-y-4">
            <button id="recordBtn" class="w-20 h-20 rounded-full bg-blue-600 flex items-center justify-center shadow-lg shadow-blue-100 transition-all active:scale-90">
                <svg id="micIcon" class="w-8 h-8 text-white" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
                </svg>
            </button>
            <p id="instruction" class="text-[11px] font-medium text-slate-400 uppercase tracking-tight">Tap to Start</p>
        </div>

        <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-100 space-y-4">
            <textarea id="resultText" class="w-full bg-transparent border-none text-slate-700 text-base leading-relaxed focus:ring-0 resize-none h-40" placeholder="內容..."></textarea>
            
            <div class="grid grid-cols-2 gap-4 pt-4 border-t border-slate-50">
                <div><span id="label-company" class="text-[10px] text-slate-400 block mb-1 uppercase font-bold">Company</span><span id="p-company" class="font-bold text-sm">-</span></div>
                <div><span id="label-price" class="text-[10px] text-slate-400 block mb-1 uppercase font-bold">Price</span><span id="p-price" class="font-bold text-sm">-</span></div>
            </div>
        </div>

        <div id="exportGrid" class="grid grid-cols-2 gap-3 opacity-20 pointer-events-none">
            <button onclick="exportExcel()" class="bg-slate-900 text-white py-4 rounded-xl text-xs font-bold">EXCEL (CSV)</button>
            <button onclick="sendEmail()" class="bg-white text-slate-900 border border-slate-200 py-4 rounded-xl text-xs font-bold font-bold">EMAIL</button>
            
            <button onclick="shareToSocial('line')" class="bg-[#00B900] text-white py-4 rounded-xl text-xs font-bold flex items-center justify-center space-x-1">
                <span>LINE / IG / FB</span>
            </button>
            <button onclick="shareToSocial('messenger')" class="bg-[#0084FF] text-white py-4 rounded-xl text-xs font-bold flex items-center justify-center space-x-1">
                <span>MESSENGER</span>
            </button>
        </div>
    </main>

    <script>
        const recordBtn = document.getElementById('recordBtn');
        const resultText = document.getElementById('resultText');
        const statusText = document.getElementById('status');
        const langSelect = document.getElementById('langSelect');
        const exportGrid = document.getElementById('exportGrid');
        
        let isRecording = false;
        let structuredData = { company: '-', price: '-' };

        // 語言字典
        const i18n = {
            'zh-TW': { ready: '準備就緒', listening: '正在聽取...', instruction: '點擊開始錄音', company: '公司', price: '金額' },
            'en-US': { ready: 'Ready', listening: 'Listening...', instruction: 'Tap to record', company: 'Company', price: 'Price' },
            'sv-SE': { ready: 'Redo', listening: 'Lyssnar...', instruction: 'Tryck för att spela in', company: 'Företag', price: 'Pris' },
            'ja-JP': { ready: '準備完了', listening: '聴いています...', instruction: 'タップして開始', company: '会社名', price: '金額' }
        };

        function updateUI() {
            const lang = langSelect.value;
            statusText.innerText = i18n[lang].ready;
            document.getElementById('instruction').innerText = i18n[lang].instruction;
            document.getElementById('label-company').innerText = i18n[lang].company;
            document.getElementById('label-price').innerText = i18n[lang].price;
            resultText.placeholder = i18n[lang].ready
