<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FieldVoice Pro v3 | 智慧轉譯系統</title>
    <link rel="manifest" href="/manifest.json">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body class="bg-[#0F0F0F] text-white flex flex-col items-center min-h-screen p-4 pb-10">
    
    <header class="w-full text-center py-6">
        <h1 class="text-[#FFBF00] text-3xl font-black italic tracking-tighter">FIELDVOICE <span class="bg-[#FFBF00] text-black px-2 rounded">PRO v3</span></h1>
        <p id="status" class="text-gray-500 text-xs mt-2 uppercase tracking-[0.2em]">Ready for Smart Sync</p>
    </header>

    <main class="w-full max-w-md space-y-6">
        
        <div class="flex justify-center py-4">
            <button id="recordBtn" class="w-28 h-28 rounded-full bg-[#FFBF00] flex items-center justify-center shadow-[0_0_40px_rgba(255,191,0,0.3)] transition-all active:scale-95">
                <svg id="micIcon" class="w-12 h-12 text-black" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
                </svg>
            </button>
        </div>

        <div class="space-y-2">
            <div class="flex justify-between items-end">
                <span class="text-[#FFBF00] text-xs font-bold uppercase">語音轉錄原文</span>
                <button onclick="clearAll()" class="text-gray-600 text-xs hover:text-red-400">清除數據</button>
            </div>
            <textarea id="resultText" class="w-full bg-[#1A1A1A] p-4 rounded-xl border border-gray-800 h-32 text-sm text-gray-300 focus:border-[#FFBF00] outline-none" placeholder="說話後內容會出現在這..."></textarea>
        </div>

        <div id="parsedCard" class="hidden bg-[#222] p-4 rounded-xl border-l-4 border-[#FFBF00] space-y-3 shadow-xl">
            <h3 class="text-[#FFBF00] text-xs font-bold italic">AI 自動分類結果</h3>
            <div class="grid grid-cols-2 gap-3 text-xs">
                <div class="text-gray-500">日期：<span id="p-date" class="text-white block mt-1 text-sm">-</span></div>
                <div class="text-gray-500">公司：<span id="p-company" class="text-white block mt-1 text-sm">-</span></div>
                <div class="text-gray-500">品項：<span id="p-item" class="text-white block mt-1 text-sm">-</span></div>
                <div class="text-gray-500">金額：<span id="p-price" class="text-white block mt-1 text-sm">-</span></div>
            </div>
        </div>

        <div id="exportGrid" class="grid grid-cols-2 gap-3 opacity-30 pointer-events-none">
            <button onclick="exportExcel()" class="bg-green-600 hover:bg-green-500 text-white text-xs font-bold py-3 rounded-lg flex flex-col items-center">
                <span>Excel (分類)</span>
            </button>
            <button onclick="exportPDF()" class="bg-red-600 hover:bg-red-500 text-white text-xs font-bold py-3 rounded-lg flex flex-col items-center">
                <span>PDF 報告</span>
            </button>
            <button onclick="exportWord()" class="bg-blue-600 hover:bg-blue-500 text-white text-xs font-bold py-3 rounded-lg flex flex-col items-center">
                <span>Word 檔</span>
            </button>
            <button onclick="exportTxt()" class="bg-gray-700 hover:bg-gray-600 text-white text-xs font-bold py-3 rounded-lg flex flex-col items-center">
                <span>純文字 TXT</span>
            </button>
            <button onclick="sendEmail()" class="col-span-2 bg-[#FFBF00] text-black font-black py-4 rounded-lg uppercase text-sm tracking-widest mt-2">
                直接寄信發送
            </button>
        </div>
    </main>

    <script>
        const recordBtn = document.getElementById('recordBtn');
        const resultText = document.getElementById('resultText');
        const statusText = document.getElementById('status');
        const exportGrid = document.getElementById('exportGrid');
        let isRecording = false;

        // 結構化數據容器
        let structuredData = { date: '', company: '', item: '', price: '' };

        // 1. 語音辨識邏輯
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SpeechRecognition) {
            const recognition = new SpeechRecognition();
            recognition.continuous = true;
            recognition.lang = 'zh-TW';
            recognition.interimResults = true;

            recordBtn.onclick = () => {
                if (!isRecording) {
                    recognition.start();
                    isRecording = true;
                    recordBtn.classList.add('bg-red-600', 'animate-pulse');
                    statusText.innerText = "Listening...";
                } else {
                    recognition.stop();
                    isRecording = false;
                    recordBtn.classList.remove('bg-red-600', 'animate-pulse');
                    statusText.innerText = "Data Processed";
                    smartParse(resultText.value); // 錄音結束後自動分析
                }
            };

            recognition.onresult = (event) => {
                let text = "";
                for (let i = 0; i < event.results.length; i++) {
                    text += event.results[i][0].transcript;
                }
                resultText.value = text;
                exportGrid.classList.remove('opacity-30', 'pointer-events-none');
            };
        }

        // 2. 核心：智慧排版邏輯 (Smart Parser)
        function smartParse(text) {
            // 設定日期
            structuredData.date = new Date().toLocaleDateString();
            
            // 邏輯拆解：利用正則表達式尋找模式
            // 匹配公司：找 "跟/與 [XXX公司]"
            const companyMatch = text.match(/(?:跟|與|向)(.*?公司)/);
            structuredData.company = companyMatch ? companyMatch[1] : "未偵測到公司";

            // 匹配品項：找 "交易/購買 [XXX]"
            const itemMatch = text.match(/(?:交易|購買|品項為)(.*?)(?:，|,|共計|花費|。|$)/);
            structuredData.item = itemMatch ? itemMatch[1] : "未偵測到品項";

            // 匹配金額：找數字加上 "元"
            const priceMatch = text.match(/(\d+)\s*元/);
            structuredData.price = priceMatch ? priceMatch[1] : "0";

            // 更新 UI
            document.getElementById('p-date').innerText = structuredData.date;
            document.getElementById('p-company').innerText = structuredData.company;
            document.getElementById('p-item').innerText = structuredData.item;
            document.getElementById('p-price').innerText = structuredData.price + " 元";
            document.getElementById
