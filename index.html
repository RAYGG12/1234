<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FieldVoice Global AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        .mic-on { animation: pulse 1.5s infinite; background-color: #ef4444 !important; }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); } 70% { box-shadow: 0 0 0 20px rgba(239, 68, 68, 0); } 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); } }
    </style>
</head>
<body class="bg-[#F8FAFC] text-slate-900 flex flex-col items-center min-h-screen p-4 pb-12">
    
    <header class="w-full max-w-md flex justify-between items-center py-6">
        <h1 class="text-xl font-black tracking-tighter italic text-slate-800">FIELDVOICE <span class="text-blue-600">AI</span></h1>
        <select id="langSelect" class="bg-white border-none text-[10px] font-black uppercase tracking-widest text-slate-500 outline-none shadow-sm px-2 py-1 rounded cursor-pointer">
            <option value="zh-TW">繁體中文 (Traditional Chinese)</option>
            <option value="zh-CN">简体中文 (Simplified Chinese)</option>
            <option value="en-US">English (US)</option>
            <option value="sv-SE">Svenska (Swedish)</option>
            <option value="ja-JP">日本語 (Japanese)</option>
            <option value="ko-KR">한국어 (Korean)</option>
        </select>
    </header>

    <main class="w-full max-w-md space-y-4">
        <div class="bg-white rounded-[2.5rem] p-8 shadow-xl shadow-slate-200/50 flex flex-col items-center border border-white">
            <button id="recordBtn" class="w-16 h-16 rounded-full bg-blue-600 flex items-center justify-center shadow-lg transition-transform active:scale-90">
                <svg class="w-6 h-6 text-white" fill="currentColor" viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
            </button>
            <p id="status" class="mt-4 text-[10px] font-bold text-slate-300 uppercase tracking-[0.3em]">Ready</p>
            
            <div class="mt-6 w-full border-t border-slate-50 pt-4 text-center">
                <label class="cursor-pointer group">
                    <span class="text-[11px] font-bold text-blue-600 group-hover:underline">或上傳語音檔案 (MP3/WAV/AAC)</span>
                    <input type="file" id="audioFile" class="hidden" accept="audio/*">
                </label>
                <p id="fileNameDisplay" class="text-[10px] text-slate-400 mt-1 truncate"></p>
            </div>
        </div>

        <div class="bg-white rounded-3xl p-6 shadow-sm border border-slate-100 space-y-4">
            <div>
                <label class="text-[10px] font-black text-blue-600 uppercase tracking-widest block mb-2">紀錄內容</label>
                <textarea id="resultText" class="w-full bg-slate-50 p-4 rounded-2xl text-sm border-none focus:ring-2 focus:ring-blue-100 h-28" placeholder="說話或上傳檔案後，AI 將在此生成內容..."></textarea>
            </div>
            <div>
                <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest block mb-3">AI 智慧分析結果</label>
                <div id="dynamicFields" class="space-y-2 text-xs text-slate-300 italic">等待數據中...</div>
            </div>
        </div>

        <div id="exportGrid" class="grid grid-cols-2 gap-2 opacity-20 pointer-events-none transition-opacity">
            <button onclick="exportExcel()" class="bg-slate-900 text-white py-4 rounded-2xl text-[10px] font-black uppercase tracking-widest">Excel 報表</button>
            <button onclick="shareToSocial()" class="bg-blue-600 text-white py-4 rounded-2xl text-[10px] font-black uppercase tracking-widest">社群分享</button>
        </div>
    </main>

    <script>
        const recordBtn = document.getElementById('recordBtn');
        const audioFile = document.getElementById('audioFile');
        const resultText = document.getElementById('resultText');
        const statusText = document.getElementById('status');
        const dynamicFields = document.getElementById('dynamicFields');
        const langSelect = document.getElementById('langSelect');
        const exportGrid = document.getElementById('exportGrid');

        let isRecording = false;
        let detectedItems = {};

        // 語音辨識
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SpeechRecognition) {
            const recognition = new SpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = true;

            recordBtn.onclick = async () => {
                recognition.lang = langSelect.value;
                if (!isRecording) {
                    try {
                        await navigator.mediaDevices.getUserMedia({ audio: true });
                        recognition.start();
                    } catch (e) { alert("無法存取麥克風"); }
                } else {
                    recognition.stop();
                }
            };

            recognition.onstart = () => { isRecording = true; recordBtn.classList.add('mic-on'); statusText.innerText = "Listening..."; };
            recognition.onend = () => { isRecording = false; recordBtn.classList.remove('mic-on'); statusText.innerText = "AI Processing..."; callAI(resultText.value, 'text'); };
            recognition.onresult = (event) => {
                let text = "";
                for (let i = 0; i < event.results.length; i++) { text += event.results[i][0].transcript; }
                resultText.value = text;
            };
        }

        // 檔案上傳
        audioFile.onchange = async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            document.getElementById('fileNameDisplay').innerText = "已選擇：" + file.name;
            statusText.innerText = "File Uploading...";

            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = async () => {
                const base64Data = reader.result.split(',')[1];
                callAI(base64Data, 'audio', file.type);
            };
        };

        // 呼叫 Vercel 後端
        async function callAI(content, type, mimeType = "") {
            if (!content) return;
            try {
                const response = await fetch('/api/analyze', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        data: content, 
                        type: type, 
                        mimeType: mimeType,
                        lang: langSelect.options[langSelect.selectedIndex].text 
                    })
                });

                const result = await response.json();
                
                if (result._transcript) {
                    resultText.value = result._transcript;
                    delete result._transcript;
                }

                detectedItems = result;
                renderUI();
                statusText.innerText = "AI Success";
                exportGrid.classList.remove('opacity-20', 'pointer-events-none');
            } catch (err) {
                statusText.innerText = "AI Error";
                console.error(err);
            }
        }

        function renderUI() {
            dynamicFields.innerHTML = "";
            Object.keys(detectedItems).forEach(key => {
                if (key.startsWith('_')) return;
                const div = document.createElement('div');
                div.className = "flex justify-between items-center bg-slate-50 p-3 rounded-xl border border-slate-100";
                div.innerHTML = `<span class="text-[10px] font-bold text-slate-400 uppercase">${key}</span><span class="text-sm font-black text-slate-700">${detectedItems[key]}</span>`;
                dynamicFields.appendChild(div);
            });
        }

        function exportExcel() {
            const keys = Object.keys(detectedItems);
            const headers = "\uFEFF" + keys.join(",");
            const values = keys.map(k => `"${detectedItems[k]}"`).join(",");
            const blob = new Blob([`${headers}\n${values}`], { type: 'text/csv;charset=utf-8;' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `Report.csv`;
            a.click();
        }

        async function shareToSocial() {
            let shareText = "FieldVoice Report:\n";
            Object.keys(detectedItems).forEach(k => shareText += `${k}: ${detectedItems[k]}\n`);
            if (navigator.share) await navigator.share({ title: 'Report', text: shareText, url: window.location.href });
            else window.open(`https://line.me/R/msg/text/?${encodeURIComponent(shareText)}`);
        }
    </script>
</body>
</html>
