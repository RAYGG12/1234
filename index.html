<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FieldVoice Pro v7 | AI Diagnostics</title>
    <link rel="manifest" href="/manifest.json">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        .mic-on { animation: pulse 1.5s infinite; background-color: #ef4444 !important; }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); } 70% { box-shadow: 0 0 0 20px rgba(239, 68, 68, 0); } 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); } }
    </style>
</head>
<body class="bg-[#F8FAFC] text-slate-900 flex flex-col items-center min-h-screen p-4 pb-12">
    
    <header class="w-full max-w-md flex justify-between items-center py-6">
        <h1 class="text-xl font-black tracking-tighter italic text-slate-800">FIELDVOICE <span class="text-blue-600">AI</span></h1>
        <select id="langSelect" class="bg-white border-none text-[10px] font-black uppercase tracking-widest text-slate-400 outline-none">
            <option value="zh-TW">繁體中文</option>
            <option value="en-US">English</option>
            <option value="sv-SE">Svenska</option>
        </select>
    </header>

    <main class="w-full max-w-md space-y-4">
        <div class="bg-white rounded-[2.5rem] p-10 shadow-xl shadow-slate-200/50 flex flex-col items-center border border-white">
            <button id="recordBtn" class="w-20 h-20 rounded-full bg-blue-600 flex items-center justify-center shadow-lg transition-transform active:scale-90">
                <svg id="micIcon" class="w-8 h-8 text-white" fill="currentColor" viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
            </button>
            <p id="status" class="mt-6 text-[10px] font-bold text-slate-300 uppercase tracking-[0.3em]">Ready</p>
        </div>

        <div class="bg-white rounded-3xl p-6 shadow-sm border border-slate-100 space-y-6">
            <div>
                <label class="text-[10px] font-black text-blue-600 uppercase tracking-widest block mb-2">原始紀錄內容</label>
                <textarea id="resultText" class="w-full bg-slate-50 p-4 rounded-2xl text-sm border-none focus:ring-2 focus:ring-blue-100 h-28" placeholder="說話後 AI 將自動分析..."></textarea>
            </div>

            <div>
                <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest block mb-3">AI 智慧分類結果</label>
                <div id="dynamicFields" class="space-y-2">
                    <p class="text-xs text-slate-300 italic">等待分析數據...</p>
                </div>
            </div>
        </div>

        <div id="exportGrid" class="grid grid-cols-2 gap-2 opacity-20 pointer-events-none">
            <button onclick="exportExcel()" class="bg-slate-900 text-white py-4 rounded-2xl text-[10px] font-black uppercase tracking-widest">Excel 報表</button>
            <button onclick="shareToSocial()" class="bg-blue-600 text-white py-4 rounded-2xl text-[10px] font-black uppercase tracking-widest">社群分享</button>
        </div>
    </main>

    <script>
        const recordBtn = document.getElementById('recordBtn');
        const resultText = document.getElementById('resultText');
        const statusText = document.getElementById('status');
        const dynamicFields = document.getElementById('dynamicFields');
        const langSelect = document.getElementById('langSelect');
        const exportGrid = document.getElementById('exportGrid');

        let isRecording = false;
        let detectedItems = {};

        // 1. 語音辨識
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SpeechRecognition) {
            const recognition = new SpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = true;

            recordBtn.onclick = async () => {
                recognition.lang = langSelect.value;
                try {
                    if (!isRecording) {
                        await navigator.mediaDevices.getUserMedia({ audio: true });
                        recognition.start();
                    } else {
                        recognition.stop();
                    }
                } catch (e) { alert("麥克風存取失敗，請檢查權限設定。"); }
            };

            recognition.onstart = () => {
                isRecording = true;
                recordBtn.classList.add('mic-on');
                statusText.innerText = "Listening...";
            };

            recognition.onend = () => {
                isRecording = false;
                recordBtn.classList.remove('mic-on');
                statusText.innerText = "Analyzing...";
                callAI(resultText.value);
            };

            recognition.onresult = (event) => {
                let text = "";
                for (let i = 0; i < event.results.length; i++) {
                    text += event.results[i][0].transcript;
                }
                resultText.value = text;
            };
        }

        // 2. 核心 AI 呼叫 (強健診斷版)
        async function callAI(text) {
            if (!text.trim()) return;
            statusText.innerText = "AI Thinking...";
            
            try {
                const response = await fetch('/.netlify/functions/analyze', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: text })
                });

                const rawData = await response.text();
                console.log("AI 原始回傳:", rawData);

                try {
                    // 嘗試解析 JSON
                    detectedItems = JSON.parse(rawData);
                    renderUI();
                    statusText.innerText = "AI Success";
                } catch (jsonErr) {
                    // 如果解析失敗（AI 回傳純文字），直接顯示文字不報錯
                    dynamicFields.innerHTML = `<div class="p-4 bg-amber-50 text-amber-700 rounded-xl text-xs border border-amber-100">
                        <strong>AI 解析提醒：</strong><br>${rawData}
                    </div>`;
                    statusText.innerText = "Partial Success";
                }
                
                exportGrid.classList.remove('opacity-20', 'pointer-events-none');

            } catch (err) {
                console.error("連線錯誤:", err);
                statusText.innerText = "AI Offline";
                dynamicFields.innerHTML = `<p class="text-red-500 text-xs font-bold">連線失敗：${err.message}</p>`;
            }
        }

        // 3. UI 渲染
        function renderUI() {
            dynamicFields.innerHTML = "";
            const keys = Object.keys(detectedItems);
            if (keys.length === 0) {
                dynamicFields.innerHTML = `<p class="text-xs text-slate-300 italic">未偵測到明確分類...</p>`;
                return;
            }

            keys.forEach(key => {
                const div = document.createElement('div');
                div.className = "flex justify-between items-center bg-slate-50 p-3 rounded-xl border border-slate-100";
                div.innerHTML = `
                    <span class="text-[10px] font-bold text-slate-400 uppercase">${key}</span>
                    <span class="text-sm font-black text-slate-700">${detectedItems[key]}</span>
                `;
                dynamicFields.appendChild(div);
            });
        }

        // 4. 匯出功能
        function exportExcel() {
            const keys = Object.keys(detectedItems);
            if (keys.length === 0) return alert("尚無數據");
            const headers = "\uFEFF" + keys.join(",");
            const values = keys.map(k => `"${detectedItems[k]}"`).join(",");
            const blob = new Blob([`${headers}\n${values}`], { type: 'text/csv;charset=utf-8;' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `Report_${Date.now()}.csv`;
            a.click();
        }

        async function shareToSocial() {
            let shareText = "FieldVoice AI 紀錄：\n";
            Object.keys(detectedItems).forEach(k => shareText += `${k}: ${detectedItems[k]}\n`);
            if (navigator.share) {
                await navigator.share({ title: 'Work Report', text: shareText, url: window.location.href });
            } else {
                window.open(`https://line.me/R/msg/text/?${encodeURIComponent(shareText)}`);
            }
        }
    </script>
</body>
</html>
